# Бренд «aviavp». Из одного репозитория собирается несколько приложений:
# у каждого свой файл brands/<id>.properties и свои картинки в brands/<id>/.
#
#   ./build.sh                 — собрать бренд по умолчанию (aviavp)
#   BRAND=proxyvv ./build.sh   — собрать другой
#
# Всё остальное — имя приложения, пакет, цвета, иконка, ссылки —
# подтягивается отсюда на этапе сборки.

# --- Как называется и чем ставится ---------------------------------------
# name          — то, что видно под иконкой и в шапке приложения.
# applicationId — идентификатор в системе. Менять его = выпустить другое
#                 приложение: обновиться поверх старого уже не получится.
brand.name=aviavp
brand.applicationId=online.tforge.aviavp
# Как приложение подписано на плитке быстрых настроек (шторка) и на
# экране виджетов. Там имя стоит рядом с чужими и должно читаться само
# по себе, поэтому может быть длиннее имени под иконкой.
brand.tileName=aviavp
# Версию поднимает release.sh: третье число растёт на каждой сборке,
# versionCode считается из тех же цифр (major*1000000 + minor*10000 + patch).
brand.versionName=2.3.9
brand.versionCode=2030009

# --- Цвета ----------------------------------------------------------------
# Формат AARRGGBB (первые два знака — прозрачность, FF = непрозрачно).
# accent     — кнопка подключения, активные вкладки, акценты.
# background — фон экранов.
# surface    — панели: верхняя шапка и нижние вкладки.
# card       — плитки серверов на фоне surface.
# Цвета сняты пипеткой со скриншотов V2Box, чтобы вид совпадал один в один.
# accent     — бирюзовый: иконки шапки, выбранная вкладка, выбранный сервер.
# background — чистый чёрный фон экрана.
# surface    — светло-серая нижняя панель с вкладками.
# card       — плитки серверов на чёрном фоне.
brand.color.accent=FF73E1F0
brand.color.background=FF000000
brand.color.surface=FF424242
brand.color.card=FF1C1C1E

# --- Ссылки ---------------------------------------------------------------
# subscription — подписка, которую приложение заводит само при первом
#                запуске. Пусто — пользователь добавляет её руками.
# support      — кнопка «Поддержка» в настройках.
# site         — кнопка «Сайт» в настройках.
brand.subscription.url=
brand.subscription.name=aviavp
# Чем клиент представляется панели при скачивании подписки.
#
# Marzneshin выбирает по этому заголовку ФОРМАТ ответа: клиентам
# «v2rayNG/2.3» и новее она отдаёт json-конфиг xray целиком, всем
# остальным — привычный список ссылок vless://, на который рассчитан
# список серверов в приложении. Поэтому значение намеренно нейтральное
# и не содержит ни «v2rayNG», ни имени бренда: меняя имя приложения,
# этот ключ трогать не нужно.
brand.subscription.userAgent=xray-client/1.0
# Схема ссылок, по которой подписка открывается именно в этом приложении:
# <схема>://install-sub?url=...  Должна быть уникальной — совпадение с
# другим клиентом приведёт к тому, что Android спросит, чем открывать.
brand.urlScheme=aviavp
# Бэкенд приложения: при каждом запуске оно представляется сюда своим
# Android ID и получает адрес подписки. Пусто — приложение работает
# как обычный клиент, подписку человек добавляет руками.
# Последняя часть адреса — идентификатор приложения на бэкенде: там
# может жить несколько приложений, и конфиг каждого лежит в apps/<id>.yml.
brand.backend.url=https://m.t-forge.online/aviavp
brand.support.url=https://t.me/supTvpn
brand.site.url=https://app.t-forge.online

# --- Иконка ---------------------------------------------------------------
# Квадратный PNG не меньше 512x512. Путь от корня репозитория.
# Отсутствует — остаётся прежняя иконка.
brand.icon.source=brands/aviavp/icon.png

# Каталог с готовыми картинками бренда. У aviavp там только иконка
# для шторки: лаунчер по-прежнему собирается из icon.source.
brand.icon.android=brands/aviavp/android

# Фон адаптивной иконки. Пусто — берётся brand.color.background.
brand.color.iconBackground=
