# VibeVPN для Android TV — бета.
#
# Отдельное приложение из отдельной копии кода (android-tv/): телефонное
# (android/) не трогаем, пока телевизионное обкатывается. Бэкенд тот же,
# что у vv, — подписка общая: телевизор входит по коду с телефона, как
# компьютер. Свой applicationId — чтобы не пересекаться с телефонным
# приложением ни при установке, ни при обновлении.
brand.name=VibeVPN TV
brand.applicationId=online.tforge.proxyvv.tv
brand.slug=vv-tv
brand.tileName=VibeVPN
# Своя линейка версий, не телефонная.
# versionCode считается из тех же цифр (major*1000000 + minor*10000 + patch).
brand.versionName=2.2.2
brand.versionCode=2020002
brand.color.accent=FFFFD23F
brand.color.background=FF000000
brand.color.surface=FF123A2F
brand.color.card=FF102820
brand.subscription.url=
brand.subscription.name=vv
brand.subscription.userAgent=xray-client/1.0
# Та же схема, что у телефонного vv: телевизор показывает QR вида
# proxyvv://join?c=…, а сканирует его телефонное приложение — своей схемой.
brand.urlScheme=proxyvv
brand.backend.url=https://m.t-forge.online/proxyvv
brand.support.url=https://t.me/supTvpn
brand.site.url=https://vv.t-forge.online
brand.icon.source=brands/tv/icon.png
brand.icon.android=brands/tv/android
brand.color.iconBackground=FF0F5C4A
